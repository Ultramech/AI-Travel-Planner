name: ai-travel-planner

services:
  # --- Infrastructure ------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NOT part of the default stack. The application backend is Supabase, set once
  # in .env and inherited by every service. This container exists only to give
  # `make test-db` a scratch database, because the integration tests write
  # fixture trips and must never point at the real one.
  #   docker compose --profile testdb up -d postgres
  postgres:
    profiles: ["testdb"]
    image: postgres:16-alpine
    # 5434 on the host: 5432 is very often already taken by a local Postgres,
    # and a port clash here fails the whole stack for no reason. Containers
    # still talk to each other on 5432 over the compose network.
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: travel_planner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d travel_planner"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Runs the Alembic migrations once, then exits. Everything that needs the
  # schema waits for this to complete rather than racing it.
  migrate:
    build: .
    command: alembic upgrade head
    # DATABASE_URL comes from .env — Supabase. Deliberately NOT overridden here:
    # the app has one backend everywhere, local and containerised alike.
    env_file: [.env]
    restart: "no"

  # KRaft mode — no ZooKeeper needed.
  # The official Apache image, not bitnami/kafka:3.7 — Bitnami removed that tag
  # from Docker Hub and the whole stack failed to pull. Note the env vars here
  # are KAFKA_*, whereas Bitnami used KAFKA_CFG_*.
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 3 partitions => up to 3 workers consume in parallel; keyed by trip_id
      # so all work for one trip stays ordered on one partition.
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Without this a fresh consumer group waits the default 3s rebalance
      # delay on every worker start, which makes local testing feel broken.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Headless Chrome for the scrapers, isolated from the app containers.
  selenium:
    # selenium/standalone-chromium supports arm64 directly now; the old
    # seleniarm/* images are deprecated and no longer maintained.
    image: selenium/standalone-chromium:latest
    shm_size: 2gb
    ports: ["4444:4444"]
    environment:
      SE_NODE_MAX_SESSIONS: "4"
      SE_NODE_SESSION_TIMEOUT: "120"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/wd/hub/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Application ---------------------------------------------------------
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      # DATABASE_URL is inherited from .env (Supabase) — see the migrate service.
      # Postgres, not SQLite: the API and every worker replica must share one
      # checkpoint store, or a trip paused on one cannot be resumed on another.
      CHECKPOINTER_BACKEND: postgres
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Scale with:  docker compose up --scale worker=3
  worker:
    build: .
    command: python -m app.workers.consumer
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
      CHECKPOINTER_BACKEND: postgres
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      selenium: {condition: service_started}
    deploy:
      replicas: 2

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api: {condition: service_started}

volumes:
  # The old `checkpoints` volume is gone deliberately: it shared one SQLite
  # file between the API and both worker replicas, which is precisely the
  # single-writer bottleneck Postgres checkpointing removes.
  pgdata:
